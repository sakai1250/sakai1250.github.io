name: Fix publication count

on:
  push:
    branches:
      - fix/publication-count

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-count
      - name: Make publication count derive from research achievements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          old = "    [{ id: 'stat-papers', v: 14 }, { id: 'stat-awards', v: 18 }, { id: 'stat-apps', v: 12 }].forEach(s => {"
          new = """    const researchSection = Array.from(document.querySelectorAll('#research-content .section-card'))
              .find(section => section.querySelector('.section-title')?.textContent.includes('Research Achievements'));
          const publicationCount = researchSection?.querySelectorAll('.repo-list > li').length || 18;
          [{ id: 'stat-papers', v: publicationCount }, { id: 'stat-awards', v: 18 }, { id: 'stat-apps', v: 12 }].forEach(s => {"""
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-publication-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.js .github/workflows/fix-publication-count.yml
          git commit -m "Fix publication count"
          git push origin HEAD:fix/publication-count
