# Validate the latest main branch after portfolio optimization finishes.
# GitHub Pages' native branch deployment remains the single deployment owner.
name: Post-optimization site validation

on:
  workflow_run:
    workflows: ["Optimize Portfolio Assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: '.python-version'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - name: Validate deployable portfolio essentials
        run: |
          for path in \
            index.html \
            404.html \
            style.css \
            main.js \
            robots.txt \
            sitemap.xml \
            assets/cv.pdf \
            assets/cv.txt \
            llms.txt \
            .well-known/security.txt; do
            if [[ ! -s "$path" ]]; then
              echo "Missing or empty deploy-critical file: $path" >&2
              exit 1
            fi
          done
      - name: Run deterministic portfolio validation
        run: python scripts/run_local_validation.py
