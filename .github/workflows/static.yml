# Validate the latest main branch after portfolio optimization finishes.
# GitHub Pages' native branch deployment remains the single deployment owner.
name: Post-optimization site validation

on:
  workflow_run:
    workflows: ["Optimize Portfolio Assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: '.python-version'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate deployable portfolio essentials
        run: |
          for path in \
            index.html \
            404.html \
            style.css \
            main.js \
            robots.txt \
            sitemap.xml \
            assets/cv.pdf \
            assets/cv.txt \
            llms.txt \
            .well-known/security.txt; do
            if [[ ! -s "$path" ]]; then
              echo "Missing or empty deploy-critical file: $path" >&2
              exit 1
            fi
          done
      - name: Validate maintenance script syntax and registry
        run: python scripts/run_deterministic_maintenance.py --compile-only
      - name: Validate JavaScript syntax
        run: node --check main.js
      - name: Validate site integrity
        run: python scripts/check_site_integrity.py
      - name: Validate research award alignment
        run: python scripts/check_research_award_alignment.py
      - name: Validate contextual share localization
        run: python scripts/check_contextual_share_localization.py
      - name: Validate interactive accessible names
        run: python scripts/check_control_accessible_names.py
      - name: Validate utility control localization
        run: python scripts/check_utility_control_localization.py
      - name: Validate form control names
        run: python scripts/check_form_control_names.py
      - name: Validate new-tab link security
        run: python scripts/check_new_tab_link_security.py
      - name: Validate progressive enhancement
        run: python scripts/check_progressive_enhancement.py
      - name: Validate local deep links
        run: python scripts/check_local_deep_links.py
      - name: Validate year filter coverage
        run: python scripts/check_year_filter_coverage.py
      - name: Validate app repository links
        run: python scripts/check_app_repo_links.py
      - name: Validate thumbnail cache policy
        run: python scripts/check_thumbnail_cache_policy.py
      - name: Validate structured profile
        run: python scripts/check_structured_profile.py
      - name: Validate CV-derived sidebar roles
        run: python scripts/check_sidebar_role_derivation.py
      - name: Validate CV-derived social profile
        run: python scripts/check_social_profile_derivation.py
      - name: Validate machine-readable profile
        run: python scripts/check_llms_profile.py
      - name: Validate security contact
        run: python scripts/check_security_contact.py
      - name: Validate Python runtime source
        run: python scripts/check_python_runtime_alignment.py
      - name: Validate GitHub Action pins
        run: python scripts/check_github_action_pins.py
      - name: Validate workflow permissions
        run: python scripts/check_workflow_permissions.py
      - name: Validate workflow timeout policy
        run: python scripts/check_workflow_timeouts.py
      - name: Validate documented local checks
        run: python scripts/check_validation_docs.py
      - name: Validate full interaction maintenance
        run: |
          python scripts/run_deterministic_maintenance.py
          git diff --exit-code -- index.html 404.html main.js style.css sitemap.xml README.md llms.txt SECURITY.md .well-known/security.txt
      - name: Validate static fallback metadata
        run: |
          python scripts/maintain_static_fallbacks.py
          git diff --exit-code -- index.html sitemap.xml
