# Deploy the latest main branch after portfolio optimization finishes.
# Deployment must not depend on optimization succeeding: that workflow fetches
# external resources, and a transient network failure must not block a valid
# main-branch update from reaching the public site.
name: Deploy static content to Pages

on:
  workflow_run:
    workflows: ["Optimize Portfolio Assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Validate deployable portfolio essentials
        run: |
          for path in \
            index.html \
            404.html \
            style.css \
            main.js \
            effects.js \
            robots.txt \
            sitemap.xml \
            assets/cv.pdf \
            assets/cv.txt \
            llms.txt \
            .well-known/security.txt; do
            if [[ ! -s "$path" ]]; then
              echo "Missing or empty deploy-critical file: $path" >&2
              exit 1
            fi
          done
      - name: Validate site integrity before deployment
        run: python scripts/check_site_integrity.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '.'
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
