name: Interaction maintenance check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Validate maintenance scripts
        run: |
          for script in \
            scripts/maintain_tabs.py \
            scripts/maintain_contact_form.py \
            scripts/maintain_header_controls.py \
            scripts/maintain_filter_accessibility.py \
            scripts/maintain_storage_resilience.py \
            scripts/maintain_asset_versions.py; do
            python -m py_compile "$script"
          done
      - name: Ensure interaction maintenance is already applied
        run: |
          python scripts/maintain_tabs.py
          python scripts/maintain_filter_accessibility.py
          git diff --exit-code -- main.js index.html
      - name: Ensure maintenance scripts are idempotent
        run: |
          run_maintenance() {
            python scripts/maintain_tabs.py
            python scripts/maintain_contact_form.py
            python scripts/maintain_header_controls.py
            python scripts/maintain_filter_accessibility.py
            python scripts/maintain_storage_resilience.py
            python scripts/maintain_asset_versions.py
          }

          run_maintenance
          git diff --binary -- index.html main.js effects.js style.css > /tmp/maintenance-first.diff
          run_maintenance
          git diff --binary -- index.html main.js effects.js style.css > /tmp/maintenance-second.diff

          if ! cmp -s /tmp/maintenance-first.diff /tmp/maintenance-second.diff; then
            echo "Maintenance scripts are not idempotent; a second run changes the generated result."
            diff -u /tmp/maintenance-first.diff /tmp/maintenance-second.diff || true
            exit 1
          fi
      - name: Validate local tab deep links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
                  if tag == 'a' and attrs.get('href'):
                      self.hrefs.append(attrs['href'])

          def parse(path):
              parser = Parser()
              parser.feed(Path(path).read_text(encoding='utf-8'))
              return parser

          index = parse('index.html')
          problems = []

          for source in ('index.html', '404.html'):
              page = parse(source)
              for href in page.hrefs:
                  parsed = urlsplit(href)
                  if parsed.scheme or parsed.netloc or not parsed.fragment:
                      continue

                  if parsed.path in ('', '/'):
                      target_ids = page.ids if parsed.path == '' else index.ids
                      if parsed.fragment not in target_ids:
                          problems.append(
                              f'{source}: local deep link {href!r} points to missing id {parsed.fragment!r}'
                          )

          if problems:
              raise SystemExit('\n'.join(problems))

          print('OK: local tab deep links resolve to existing ids')
          PY
