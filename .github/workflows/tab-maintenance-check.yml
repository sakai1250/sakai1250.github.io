name: Interaction maintenance check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Validate maintenance scripts
        run: |
          for script in \
            scripts/maintain_tabs.py \
            scripts/maintain_contact_form.py \
            scripts/maintain_header_controls.py \
            scripts/maintain_filter_accessibility.py \
            scripts/maintain_storage_resilience.py \
            scripts/maintain_external_links.py \
            scripts/maintain_asset_versions.py \
            scripts/check_app_repo_links.py \
            scripts/check_local_deep_links.py; do
            python -m py_compile "$script"
          done
      - name: Validate maintenance state and idempotence
        run: |
          run_maintenance() {
            python scripts/maintain_tabs.py
            python scripts/maintain_contact_form.py
            python scripts/maintain_header_controls.py
            python scripts/maintain_filter_accessibility.py
            python scripts/maintain_storage_resilience.py
            python scripts/maintain_external_links.py
            python scripts/maintain_asset_versions.py
          }

          tracked_site_files=(index.html 404.html main.js effects.js style.css)
          first_diff="$(mktemp)"
          second_diff="$(mktemp)"

          run_maintenance
          git diff --binary -- "${tracked_site_files[@]}" > "$first_diff"

          if [[ -s "$first_diff" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "Portfolio maintenance is not fully applied to tracked site files."
              cat "$first_diff"
              exit 1
            fi
            echo "::notice::Portfolio maintenance produced changes on this push; Optimize Portfolio Assets will apply them to main."
          fi

          # Compare the complete diff after a second pass with the first-pass diff.
          # If they differ, at least one maintenance script is not idempotent.
          run_maintenance
          git diff --binary -- "${tracked_site_files[@]}" > "$second_diff"
          if ! cmp -s "$first_diff" "$second_diff"; then
            echo "Portfolio maintenance scripts are not idempotent."
            diff -u "$first_diff" "$second_diff" || true
            exit 1
          fi
      - name: Validate app repository mappings
        run: python scripts/check_app_repo_links.py
      - name: Validate local tab deep links
        run: python scripts/check_local_deep_links.py
