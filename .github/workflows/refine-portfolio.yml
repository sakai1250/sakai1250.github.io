name: Refine portfolio visual consensus

on:
  push:
    branches:
      - improve/visual-consensus

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/visual-consensus
      - name: Refine colors, hierarchy, and interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # --- style.css ---
          p = Path('style.css')
          s = p.read_text()
          replacements = {
              '--accent: #9A7030;': '--accent: #8A611E;',
              '--particle-color: rgba(184, 138, 68, 0.30);': '--particle-color: rgba(138, 97, 30, 0.18);',
              '--particle-color: rgba(198, 161, 91, 0.22);': '--particle-color: rgba(198, 161, 91, 0.14);',
              'radial-gradient(circle at 12% 8%, rgba(184, 138, 68, 0.055), transparent 26%),': 'radial-gradient(circle at 12% 8%, rgba(138, 97, 30, 0.050), transparent 26%),',
              '  cursor: grab;': '  cursor: default;',
              '  touch-action: none;': '  touch-action: auto;',
              '  content: attr(data-tags) " · 0.98";': '  content: attr(data-tags);',
          }
          for old, new in replacements.items():
              if old not in s:
                  print(f'warning: style target not found: {old}')
              s = s.replace(old, new)

          dark_hover = '''\n[data-theme="dark"] .header-btn.primary:hover {\n  border-color: var(--accent-2);\n  background: var(--accent-2);\n  color: #09131F;\n}\n'''
          anchor = '''.header-btn.primary:hover {\n  border-color: var(--accent);\n  background: var(--primary-soft);\n  color: #FFFFFF;\n}\n'''
          if dark_hover.strip() not in s:
              if anchor not in s:
                  raise SystemExit('header primary hover block not found')
              s = s.replace(anchor, anchor + dark_hover, 1)
          p.write_text(s)

          # --- index.html: remove multicolor emoji from section headings only ---
          p = Path('index.html')
          s = p.read_text()
          section_re = re.compile(
              r'(<h2 class="section-title">\s*<span lang="ja">)([^<]*)(</span>\s*<span lang="en">)([^<]*)(</span>\s*</h2>)',
              re.S,
          )
          def clean_heading(match):
              ja = re.sub(r'^[^\wぁ-んァ-ヶ一-龯]+', '', match.group(2), count=1)
              en = re.sub(r'^[^A-Za-z0-9]+', '', match.group(4), count=1)
              return match.group(1) + ja + match.group(3) + en + match.group(5)
          s, count = section_re.subn(clean_heading, s)
          print(f'cleaned {count} section heading blocks')
          p.write_text(s)

          # --- main.js: prioritize research results and remove novelty interactions ---
          p = Path('main.js')
          s = p.read_text()
          old_calls = '''    safeInit(initCopyButtons, 'CopyButtons');\n    safeInit(initTOC, 'TOC');\n    safeInit(initSectionTabs, 'SectionTabs');'''
          new_calls = '''    safeInit(initCopyButtons, 'CopyButtons');\n    safeInit(initResearchPriority, 'ResearchPriority');\n    safeInit(initTOC, 'TOC');\n    safeInit(initSectionTabs, 'SectionTabs');'''
          if old_calls not in s:
              raise SystemExit('core init insertion point not found')
          s = s.replace(old_calls, new_calls, 1)

          for line in [
              "    safeInit(window.init3DEffects || init3DEffects, '3DEffects');\n",
              "    safeInit(window.initAvatarDragGuide || initAvatarDragGuide, 'AvatarDragGuide');\n",
              "    safeInit(window.initCardDragRotation || initCardDragRotation, 'CardDragRotation');\n",
          ]:
              s = s.replace(line, '')

          marker = 'function initTOC() {'
          if 'function initResearchPriority()' not in s:
              if marker not in s:
                  raise SystemExit('initTOC marker not found')
              function = '''function initResearchPriority() {\n    const content = document.getElementById('research-content');\n    if (!content) return;\n\n    const sections = Array.from(content.querySelectorAll(':scope > .section-card'));\n    const achievements = sections.find(section =>\n        section.querySelector('.section-title')?.textContent.includes('Research Achievements')\n    );\n    const education = sections.find(section =>\n        section.querySelector('.section-title')?.textContent.includes('Education')\n    );\n\n    if (achievements && education) content.insertBefore(achievements, education);\n}\n\n'''
              s = s.replace(marker, function + marker, 1)
          p.write_text(s)
          PY
      - name: Commit refinements and remove temporary workflow
        run: |
          rm .github/workflows/refine-portfolio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- style.css index.html main.js .github/workflows/refine-portfolio.yml
          git commit -m "Refine portfolio visual hierarchy and color"
          git push origin HEAD:improve/visual-consensus
