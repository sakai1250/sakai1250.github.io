name: Format publication count fix

on:
  push:
    branches:
      - fix/publication-count

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-count
      - name: Format the publication count block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          old = """    const researchSection = Array.from(document.querySelectorAll('#research-content .section-card'))
    .find(section => section.querySelector('.section-title')?.textContent.includes('Research Achievements'));
const publicationCount = researchSection?.querySelectorAll('.repo-list > li').length || 18;
[{ id: 'stat-papers', v: publicationCount }, { id: 'stat-awards', v: 18 }, { id: 'stat-apps', v: 12 }].forEach(s => {"""
          new = """    const researchSection = Array.from(document.querySelectorAll('#research-content .section-card'))
        .find(section => section.querySelector('.section-title')?.textContent.includes('Research Achievements'));
    const publicationCount = researchSection?.querySelectorAll('.repo-list > li').length || 18;
    [{ id: 'stat-papers', v: publicationCount }, { id: 'stat-awards', v: 18 }, { id: 'stat-apps', v: 12 }].forEach(s => {"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/format-publication-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.js .github/workflows/format-publication-count.yml
          git commit -m "Format publication count fix"
          git push origin HEAD:fix/publication-count
