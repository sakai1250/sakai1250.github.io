name: Keep static fallbacks aligned

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main.js'
      - 'style.css'
      - 'effects.js'
      - 'sitemap.xml'
      - '.github/workflows/static-fallbacks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-fallbacks-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Sync visible fallback metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          index_path = Path('index.html')
          sitemap_path = Path('sitemap.xml')
          text = index_path.read_text(encoding='utf-8')

          tracked_page_files = ['index.html', 'main.js', 'style.css', 'effects.js']
          source_dates = []
          for tracked_file in tracked_page_files:
              result = subprocess.run(
                  ['git', 'log', '-1', '--format=%cs', '--', tracked_file],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              value = result.stdout.strip()
              if value:
                  source_dates.append(value)
          if not source_dates:
              raise SystemExit('Could not resolve a source update date')
          source_lastmod = max(source_dates)
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', source_lastmod):
              raise SystemExit(f'Unexpected source update date: {source_lastmod}')

          ns_uri = 'http://www.sitemaps.org/schemas/sitemap/0.9'
          ET.register_namespace('', ns_uri)
          ns = {'sm': ns_uri}
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          home_lastmod = None
          for url in root.findall('sm:url', ns):
              loc = url.find('sm:loc', ns)
              lastmod = url.find('sm:lastmod', ns)
              if loc is not None and loc.text == 'https://sakai1250.github.io/' and lastmod is not None:
                  lastmod.text = source_lastmod
                  home_lastmod = source_lastmod
                  break
          if not home_lastmod:
              raise SystemExit('Could not resolve homepage lastmod in sitemap.xml')
          tree.write(sitemap_path, encoding='UTF-8', xml_declaration=True)

          section_pattern = re.compile(
              r'<section\b[^>]*class="[^"]*\bsection-card\b[^"]*"[^>]*>[\s\S]*?</section>',
              re.IGNORECASE,
          )
          heading_pattern = re.compile(
              r'<h2\b[^>]*class="[^"]*\bsection-title\b[^"]*"[^>]*>([\s\S]*?)</h2>',
              re.IGNORECASE,
          )
          english_title_pattern = re.compile(
              r'<span\s+lang="en">([\s\S]*?)</span>',
              re.IGNORECASE,
          )

          def plain_text(fragment):
              return html.unescape(re.sub(r'<[^>]+>', '', fragment)).strip()

          def section_block(english_title):
              for match in section_pattern.finditer(text):
                  block = match.group(0)
                  heading = heading_pattern.search(block)
                  if not heading:
                      continue
                  title_match = english_title_pattern.search(heading.group(1))
                  if title_match and plain_text(title_match.group(1)) == english_title:
                      return block
              raise SystemExit(f'Could not find section: {english_title}')

          counts = {
              'stat-papers': len(re.findall(r'<li\b', section_block('Research Achievements'))),
              'stat-awards': len(re.findall(r'<li\b', section_block('Awards'))),
              'stat-apps': len(re.findall(r'<div\s+class="app-card"(?:\s|>)', section_block('My Apps & Services'))),
          }
          if any(value <= 0 for value in counts.values()):
              raise SystemExit(f'Unexpected zero count: {counts}')

          for element_id, value in counts.items():
              pattern = rf'(<div\s+class="stat-value"\s+id="{re.escape(element_id)}">)[^<]*(</div>)'
              text, replacements = re.subn(pattern, rf'\g<1>{value}\g<2>', text, count=1)
              if replacements != 1:
                  raise SystemExit(f'Could not update {element_id}')

          text, ja_count = re.subn(
              r'(<span\s+id="last-updated">)\d{4}-\d{2}-\d{2}(</span>)',
              rf'\g<1>{home_lastmod}\g<2>',
              text,
              count=1,
          )
          text, en_count = re.subn(
              r'(<span\s+id="last-updated-en">)\d{4}-\d{2}-\d{2}(</span>)',
              rf'\g<1>{home_lastmod}\g<2>',
              text,
              count=1,
          )
          if ja_count != 1 or en_count != 1:
              raise SystemExit('Could not update both footer dates')

          index_path.write_text(text, encoding='utf-8')
          print(f'Portfolio stats: {counts}; source/footer/sitemap date: {home_lastmod}')
          PY

      - name: Commit synchronized fallbacks
        run: |
          git config user.name 'sakai1250'
          git config user.email '92532910+sakai1250@users.noreply.github.com'
          git add index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'Portfolio fallbacks already aligned.'
            exit 0
          fi
          git commit -m 'Keep visible portfolio fallbacks current'
          git push