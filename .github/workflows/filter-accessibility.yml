name: Filter accessibility

on:
  push:
    branches:
      - main
    paths:
      - main.js
      - scripts/maintain_filter_accessibility.py
      - .github/workflows/filter-accessibility.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Keep filter state accessible
        run: python scripts/maintain_filter_accessibility.py

      - name: Check JavaScript syntax
        run: node --check main.js

      - name: Commit filter accessibility updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Keep filter selection accessible"
          file_pattern: "main.js"
          commit_user_name: "sakai1250"
          commit_user_email: "92532910+sakai1250@users.noreply.github.com"
          commit_author: "sakai1250 <92532910+sakai1250@users.noreply.github.com>"
