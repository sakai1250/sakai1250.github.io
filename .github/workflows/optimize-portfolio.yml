name: Optimize Portfolio Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: optimize-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements-maintenance.txt

      - name: Process README and optimize images
        run: python scripts/sync_readme_assets.py

      - name: Guard thumbnail cache fallback policy
        run: |
          python <<'PY'
          from pathlib import Path

          text = Path('scripts/sync_readme_assets.py').read_text(encoding='utf-8')
          required = [
              'expected_files.add(filename)',
              'if local_path.is_file():',
              'return local_web_path',
              'if filename not in expected_files:',
          ]
          missing = [snippet for snippet in required if snippet not in text]
          if missing:
              raise SystemExit(f'Thumbnail cache fallback policy is incomplete: {missing}')
          legacy_cleanup = 'if filename not in ' + 'generated_files:'
          if legacy_cleanup in text:
              raise SystemExit('Thumbnail cleanup still depends on current-run download success')
          PY

      - name: Keep app repository links aligned
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def align_app_repo(title, expected_repo):
              global text
              marker = f'>{title}</a>'
              start = text.find(marker)
              if start == -1:
                  raise SystemExit(f'Could not find app title: {title}')

              next_card = text.find('<div class="app-card"', start + len(marker))
              end = next_card if next_card != -1 else len(text)
              block = text[start:end]
              pattern = re.compile(
                  r'href="https://github\.com/sakai1250/(?:PresentMemo|otsuri_docter)"(?P<attrs>[^>]*)>GitHub</a>'
              )
              def replacement(match):
                  return (
                      f'href="https://github.com/sakai1250/{expected_repo}"'
                      f'{match.group("attrs")}>GitHub</a>'
                  )
              updated, count = pattern.subn(replacement, block, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one GitHub link in app card: {title}')
              text = text[:start] + updated + text[end:]

          align_app_repo('おつりDoctor (iOS)', 'otsuri_docter')
          align_app_repo('MAIORAL (iOS)', 'PresentMemo')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Keep profile metadata aligned
        run: python scripts/maintain_profile_metadata.py

      - name: Keep site interactions and external links aligned
        run: python scripts/run_deterministic_maintenance.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: update portfolio assets and optimized images"
          file_pattern: "assets/* index.html 404.html main.js style.css"
          commit_user_name: "sakai1250"
          commit_user_email: "92532910+sakai1250@users.noreply.github.com"
          commit_author: "sakai1250 <92532910+sakai1250@users.noreply.github.com>"
