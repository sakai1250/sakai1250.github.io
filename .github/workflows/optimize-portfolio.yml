name: Optimize Portfolio Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: optimize-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Process README and optimize images
        run: |
          python <<'PY'
          import json
          import os
          import re
          from io import BytesIO

          import requests
          from PIL import Image

          README_URL = 'https://raw.githubusercontent.com/sakai1250/sakai1250/main/Readme.md'
          ASSETS_DIR = 'assets'
          THUMB_DIR = os.path.join(ASSETS_DIR, 'thumbnails')
          DATA_FILE = os.path.join(ASSETS_DIR, 'data.json')

          os.makedirs(THUMB_DIR, exist_ok=True)
          generated_files = set()

          res = requests.get(README_URL, timeout=20)
          res.raise_for_status()
          content = res.text

          data = {'badges': {}, 'apps': {}}

          def extract_images(header_pattern):
              pattern = re.compile(
                  rf'^#+\s*(?:{header_pattern})\s*$([\s\S]*?)(?=^#+\s|\Z)',
                  re.IGNORECASE | re.MULTILINE,
              )
              match = pattern.search(content)
              if not match:
                  return []

              block = match.group(1)
              img_pattern = re.compile(
                  r'!\[(.*?)\]\((.*?)\)|<img\s+[^>]*src=["\'](.*?)["\'][^>]*>',
                  re.IGNORECASE,
              )
              images = []
              for m in img_pattern.finditer(block):
                  if m.group(1) is not None:
                      images.append({'alt': m.group(1), 'src': m.group(2)})
                  else:
                      tag = m.group(0)
                      alt_match = re.search(r'alt=["\'](.*?)["\']', tag, re.IGNORECASE)
                      images.append({'alt': alt_match.group(1) if alt_match else '', 'src': m.group(3)})
              return images

          data['badges']['badges-languages'] = extract_images(
              r'Programming\s+languages|Languages|言語'
          )
          data['badges']['badges-frameworks'] = extract_images(
              r'Frameworks|Tools|ツール|技術'
          )
          data['badges']['badges-orgs'] = extract_images(
              r'Organizations|所属'
          )

          apps_match = re.search(
              r'^##\s+My Apps\s*$([\s\S]*?)(?=^##\s|\Z)',
              content,
              re.IGNORECASE | re.MULTILINE,
          )
          apps_content = apps_match.group(1) if apps_match else ''

          # Each app is represented by one <td> block in the profile README.
          # Parsing the whole cell keeps its title, description, image and repo together.
          app_blocks = re.findall(
              r'<td\b[^>]*>([\s\S]*?)</td>',
              apps_content,
              re.IGNORECASE,
          )

          for block in app_blocks:
              # Only accept repository URLs from anchor href values. Image sources such as
              # github.com/user-attachments/assets/... are not repositories.
              repo_match = re.search(
                  r'<a\b[^>]*href=["\']https?://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+?)(?:\.git)?["\'][^>]*>',
                  block,
                  re.IGNORECASE,
              )
              if not repo_match:
                  continue

              full_repo = repo_match.group(1)

              paragraph_match = re.search(r'<p\b[^>]*>([\s\S]*?)</p>', block, re.IGNORECASE)
              desc = ''
              if paragraph_match:
                  desc = re.sub(r'<[^>]+>', ' ', paragraph_match.group(1))
                  desc = re.sub(r'\s+', ' ', desc).strip()

              img_match = re.search(r'<img\s+[^>]*src=["\'](.*?)["\']', block, re.IGNORECASE)
              img_src = img_match.group(1) if img_match else None

              app_data = {'desc': desc}
              if img_src and img_src.startswith('http'):
                  try:
                      filename = f"{full_repo.replace('/', '_')}.webp"
                      local_path = os.path.join(THUMB_DIR, filename)
                      image_res = requests.get(img_src, timeout=20)
                      image_res.raise_for_status()
                      img = Image.open(BytesIO(image_res.content))
                      if img.mode == 'P':
                          img = img.convert('RGBA')
                      elif img.mode == 'CMYK':
                          img = img.convert('RGB')
                      img.thumbnail((400, 400))
                      img.save(local_path, 'WEBP', quality=85)
                      generated_files.add(filename)
                      app_data['img'] = f'assets/thumbnails/{filename}'
                  except Exception as exc:
                      print(f'Error processing image for {full_repo}: {exc}')
                      app_data['img'] = img_src

              data['apps'][full_repo] = app_data

          for filename in os.listdir(THUMB_DIR):
              if filename not in generated_files:
                  os.remove(os.path.join(THUMB_DIR, filename))

          with open(DATA_FILE, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Keep app repository links aligned
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def align_app_repo(title, expected_repo):
              global text
              marker = f'>{title}</a>'
              start = text.find(marker)
              if start == -1:
                  raise SystemExit(f'Could not find app title: {title}')

              next_card = text.find('<div class="app-card"', start + len(marker))
              end = next_card if next_card != -1 else len(text)
              block = text[start:end]
              pattern = re.compile(
                  r'href="https://github\.com/sakai1250/(?:PresentMemo|otsuri_docter)">GitHub</a>'
              )
              replacement = f'href="https://github.com/sakai1250/{expected_repo}">GitHub</a>'
              updated, count = pattern.subn(replacement, block, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one GitHub link in app card: {title}')
              text = text[:start] + updated + text[end:]

          align_app_repo('おつりDoctor (iOS)', 'otsuri_docter')
          align_app_repo('MAIORAL (iOS)', 'PresentMemo')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Keep structured profile aligned
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_title = '"jobTitle": "Ph.D. Student / Researcher / Engineer"'
          new_title = '"jobTitle": "Ph.D. Student / Special Assistant / Researcher / Engineer"'
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          elif new_title not in text:
              raise SystemExit('Could not find expected JSON-LD jobTitle')

          old_affiliation = '"alumniOf": "Meijo University"'
          new_affiliation = '"affiliation": {"@type": "CollegeOrUniversity", "name": "Meijo University"}'
          if old_affiliation in text:
              text = text.replace(old_affiliation, new_affiliation, 1)
          elif new_affiliation not in text:
              raise SystemExit('Could not find expected JSON-LD affiliation')

          old_context = '"@context": "http://schema.org"'
          new_context = '"@context": "https://schema.org"'
          if old_context in text:
              text = text.replace(old_context, new_context, 1)
          elif new_context not in text:
              raise SystemExit('Could not find expected JSON-LD schema context')

          old_description = '名城大学大学院 博士後期課程 坂井泰吾のポートフォリオ。Deep Learning, Computer Visionの研究や、iOS/Webアプリ開発の実績を紹介しています。'
          new_description = '名城大学大学院 博士後期課程・Special Assistant 坂井泰吾のポートフォリオ。Computer Vision、Continual Learning、Multi-View Trackingの研究とiOS/Web開発実績を紹介しています。'
          count = text.count(old_description)
          if count:
              text = text.replace(old_description, new_description)
          elif text.count(new_description) < 2:
              raise SystemExit('Could not find expected profile meta descriptions')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Keep visible profile fallback aligned
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          role = 'Ph.D. Student · Special Assistant · Computer Vision Researcher'
          empty = '<span id="typing-text"></span>'
          filled = f'<span id="typing-text">{role}</span>'
          if empty in text:
              text = text.replace(empty, filled, 1)
          elif filled not in text:
              raise SystemExit('Could not find expected visible profile role')

          ja_pattern = re.compile(
              r'(理工学研究科 電気電子・情報・材料工学専攻<br>\n\s*博士後期課程)(?: · Special Assistant)+'
          )
          text, ja_count = ja_pattern.subn(r'\1 · Special Assistant', text, count=1)
          if ja_count != 1:
              raise SystemExit('Could not normalize Japanese sidebar role')

          en_pattern = re.compile(
              r'(Dept\. of Electrical, Electronic, Information and Materials Engineering<br>\n\s*Ph\.D\. Course)(?: · Special Assistant)+'
          )
          text, en_count = en_pattern.subn(r'\1 · Special Assistant', text, count=1)
          if en_count != 1:
              raise SystemExit('Could not normalize English sidebar role')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Keep canonical portfolio URL aligned
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          canonical = '  <link rel="canonical" href="https://sakai1250.github.io/">\n'
          if canonical not in text:
              marker = '  <meta property="og:url" content="https://sakai1250.github.io/">\n'
              if marker not in text:
                  raise SystemExit('Could not find canonical insertion point')
              text = text.replace(marker, marker + canonical, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Keep tab deep links working
        run: python scripts/maintain_tabs.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update portfolio assets and optimized images"
          file_pattern: "assets/* index.html main.js"
          commit_user_name: "sakai1250"
          commit_user_email: "92532910+sakai1250@users.noreply.github.com"
          commit_author: "sakai1250 <92532910+sakai1250@users.noreply.github.com>"
