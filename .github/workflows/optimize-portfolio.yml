name: Optimize Portfolio Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: optimize-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements-maintenance.txt

      - name: Process README and optimize images
        run: python scripts/sync_readme_assets.py

      - name: Guard thumbnail cache fallback policy
        run: python scripts/check_thumbnail_cache_policy.py

      - name: Keep deterministic portfolio maintenance aligned
        run: python scripts/run_deterministic_maintenance.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: update portfolio assets and optimized images"
          file_pattern: "assets/* index.html 404.html main.js style.css sitemap.xml README.md llms.txt SECURITY.md .well-known/security.txt"
          commit_user_name: "sakai1250"
          commit_user_email: "92532910+sakai1250@users.noreply.github.com"
          commit_author: "sakai1250 <92532910+sakai1250@users.noreply.github.com>"
