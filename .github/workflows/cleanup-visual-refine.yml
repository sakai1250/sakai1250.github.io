name: Cleanup visual refinement branch

on:
  push:
    branches:
      - improve/visual-consensus

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/visual-consensus
      - name: Cleanup branch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          old = """    const researchSection = Array.from(document.querySelectorAll('#research-content .section-card'))
    .find(section => section.querySelector('.section-title')?.textContent.includes('Research Achievements'));
const publicationCount = researchSection?.querySelectorAll('.repo-list > li').length || 18;
[{ id: 'stat-papers', v: publicationCount }, { id: 'stat-awards', v: 18 }, { id: 'stat-apps', v: 12 }].forEach(s => {"""
          new = """    const researchSection = Array.from(document.querySelectorAll('#research-content .section-card'))
        .find(section => section.querySelector('.section-title')?.textContent.includes('Research Achievements'));
    const publicationCount = researchSection?.querySelectorAll('.repo-list > li').length || 18;
    [{ id: 'stat-papers', v: publicationCount }, { id: 'stat-awards', v: 18 }, { id: 'stat-apps', v: 12 }].forEach(s => {"""
          if old not in s:
              raise SystemExit('publication count block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .trigger-visual-refine
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/cleanup-visual-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.js .trigger-visual-refine .github/workflows/cleanup-visual-refine.yml
          git commit -m "Clean visual refinement branch"
          git push origin HEAD:improve/visual-consensus
