name: External Link Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'README.md'
      - 'SECURITY.md'
      - '.well-known/security.txt'
      - 'llms.txt'
      - 'assets/cv.txt'
      - 'scripts/check_external_links.py'
      - '.github/workflows/external-links.yml'
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - 'README.md'
      - 'SECURITY.md'
      - '.well-known/security.txt'
      - 'llms.txt'
      - 'assets/cv.txt'
      - 'scripts/check_external_links.py'
      - '.github/workflows/external-links.yml'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Check external links
        run: python scripts/check_external_links.py
