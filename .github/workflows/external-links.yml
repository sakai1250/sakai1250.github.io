name: External Link Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'README.md'
      - 'SECURITY.md'
      - '.well-known/security.txt'
      - 'llms.txt'
      - 'assets/cv.txt'
      - '.github/workflows/external-links.yml'
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - 'README.md'
      - 'SECURITY.md'
      - '.well-known/security.txt'
      - 'llms.txt'
      - 'assets/cv.txt'
      - '.github/workflows/external-links.yml'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          import re
          import time

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = set()

              def handle_starttag(self, tag, attrs):
                  if tag != 'a':
                      return
                  href = dict(attrs).get('href', '')
                  if href.startswith(('http://', 'https://')):
                      self.links.add(href)

          parser = LinkParser()
          for path in ('index.html', '404.html'):
              parser.feed(Path(path).read_text(encoding='utf-8'))

          links = set(parser.links)
          url_pattern = re.compile(r'https?://[^\s<>"\')\]]+')
          for path in ('README.md', 'SECURITY.md', '.well-known/security.txt', 'llms.txt', 'assets/cv.txt'):
              links.update(url_pattern.findall(Path(path).read_text(encoding='utf-8')))

          failures = []
          print(f'Checking {len(links)} external links')

          for url in sorted(links):
              status = None
              error = None
              for method in ('HEAD', 'GET'):
                  for attempt in range(2):
                      try:
                          request = Request(
                              url,
                              method=method,
                              headers={'User-Agent': 'Mozilla/5.0 portfolio-link-check/1.0'},
                          )
                          with urlopen(request, timeout=15) as response:
                              status = response.status
                          error = None
                          break
                      except HTTPError as exc:
                          status = exc.code
                          # 401/403/429 usually mean the page exists but rejects automation.
                          if status in (401, 403, 429):
                              error = None
                              break
                          error = str(exc)
                          # 404/410 are deterministic; server errors get one retry.
                          if status in (404, 410):
                              break
                      except (URLError, TimeoutError) as exc:
                          status = None
                          error = str(exc)

                      if attempt == 0:
                          time.sleep(0.75)

                  if status is not None and (status < 500 or status in (401, 403, 429)):
                      break
                  if method == 'HEAD':
                      status = None
                      error = None

              if status in (404, 410) or (status is not None and status >= 500) or status is None:
                  failures.append((url, status, error))
                  print(f'FAIL {status or "ERR"}: {url} {error or ""}')
              else:
                  print(f'OK   {status}: {url}')

          if failures:
              raise SystemExit(f'{len(failures)} external link(s) are broken or unreachable')
