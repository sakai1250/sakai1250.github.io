name: Site integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check local links and duplicate IDs
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('.')
          html_files = [root / 'index.html', root / '404.html']
          missing = []
          total_ids = 0
          total_refs = 0

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  for key in ('href', 'src'):
                      if key in attrs:
                          self.refs.append(attrs[key])

          for html_path in html_files:
              if not html_path.exists():
                  missing.append(f'missing HTML file {html_path}')
                  continue

              parser = Parser()
              parser.feed(html_path.read_text(encoding='utf-8'))

              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  missing.append(f'{html_path}: duplicate HTML ids {duplicates}')

              ids = set(parser.ids)
              total_ids += len(ids)
              total_refs += len(parser.refs)

              for ref in parser.refs:
                  if not ref or ref.startswith(('http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:')):
                      continue
                  if ref.startswith('#'):
                      anchor = ref[1:]
                      if anchor and anchor not in ids:
                          missing.append(f'{html_path}: missing anchor {ref}')
                      continue
                  path = urlsplit(ref).path
                  if not path or path == '/':
                      continue
                  target = root / path.lstrip('/')
                  if not target.exists():
                      missing.append(f'{html_path}: missing file {path}')

          required = ['assets/cv.pdf', 'assets/avatar.jpg', 'style.css', 'main.js', '404.html']
          for path in required:
              if not (root / path).exists():
                  missing.append(f'missing required asset {path}')

          if missing:
              raise SystemExit('\n'.join(missing))

          print(f'OK: {len(html_files)} HTML files, {total_ids} unique ids, {total_refs} references checked')
          PY
