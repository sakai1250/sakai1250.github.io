name: Progressive enhancement check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - main.js
      - .github/workflows/progressive-enhancement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-static-content-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify portfolio is visible without JavaScript
        run: |
          if grep -Fq 'id="loading-screen"' index.html; then
            echo 'Blocking loading screen detected. Static portfolio content must remain visible even if JavaScript fails.' >&2
            exit 1
          fi
          if grep -Fq 'initLoader' main.js; then
            echo 'JavaScript loader logic detected. Core portfolio content must not depend on JavaScript removing an overlay.' >&2
            exit 1
          fi
          if grep -Fq "classList.add('reveal-item')" main.js || grep -Fq 'classList.add("reveal-item")' main.js; then
            echo 'JavaScript hides core content for reveal effects. Core portfolio content must be visible before JavaScript runs.' >&2
            exit 1
          fi
          if ! grep -Fq 'id="main-content"' index.html; then
            echo 'Static main content is missing from index.html.' >&2
            exit 1
          fi
          if ! grep -Fq 'id="research-content" class="tab-content active"' index.html; then
            echo 'Research content is not statically visible by default.' >&2
            exit 1
          fi
          if ! grep -Fq 'id="engineer-content" class="tab-content"' index.html; then
            echo 'Engineering content is missing from the static document.' >&2
            exit 1
          fi
          if grep -Eq 'id="(research|engineer)-content"[^>]*[[:space:]]hidden([[:space:]=]|>)' index.html; then
            echo 'A primary content panel is hidden in static HTML and would disappear when JavaScript fails.' >&2
            exit 1
          fi
          if grep -Eq '\.tab-content[^}]*display[[:space:]]*:[[:space:]]*none' style.css; then
            echo 'CSS hides primary tab content before JavaScript runs.' >&2
            exit 1
          fi
          if ! grep -Fq 'id="research-tab" data-tab="research" href="#research-content"' index.html; then
            echo 'Research primary navigation is not a usable static page link.' >&2
            exit 1
          fi
          if ! grep -Fq 'id="engineer-tab" data-tab="engineer" href="#engineer-content"' index.html; then
            echo 'Engineering primary navigation is not a usable static page link.' >&2
            exit 1
          fi
          if ! grep -Fq 'href="assets/cv.pdf"' index.html; then
            echo 'Static CV link is missing from index.html.' >&2
            exit 1
          fi
          if grep -Fq '.header-actions .header-btn.primary { display: none; }' style.css; then
            echo 'Mobile CSS hides the primary GitHub action and makes it depend on JavaScript.' >&2
            exit 1
          fi
          if ! grep -Fq 'href="https://github.com/sakai1250"' index.html; then
            echo 'Static GitHub profile link is missing from index.html.' >&2
            exit 1
          fi
          if ! grep -Fq 'href="https://scholar.google.com/citations?user=eS-5wrQAAAAJ' index.html; then
            echo 'Static Google Scholar link is missing from index.html.' >&2
            exit 1
          fi
