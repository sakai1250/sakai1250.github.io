name: Progressive enhancement check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/progressive-enhancement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-no-js-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify no-JavaScript fallback
        run: |
          if ! grep -Fq '<noscript><style>#loading-screen{display:none!important}</style></noscript>' index.html; then
            echo 'Missing no-JavaScript fallback: loading screen may block the portfolio.' >&2
            exit 1
          fi
