name: Progressive enhancement check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/progressive-enhancement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-static-content-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify portfolio is visible without JavaScript
        run: |
          if grep -Fq 'id="loading-screen"' index.html; then
            echo 'Blocking loading screen detected. Static portfolio content must remain visible even if JavaScript fails.' >&2
            exit 1
          fi
          if ! grep -Fq 'id="main-content"' index.html; then
            echo 'Static main content is missing from index.html.' >&2
            exit 1
          fi
