name: Progressive enhancement check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - main.js
      - scripts/check_progressive_enhancement.py
      - .github/workflows/progressive-enhancement.yml
  pull_request:
    paths:
      - index.html
      - style.css
      - main.js
      - scripts/check_progressive_enhancement.py
      - .github/workflows/progressive-enhancement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-static-content-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify portfolio is visible without JavaScript
        run: python3 scripts/check_progressive_enhancement.py
