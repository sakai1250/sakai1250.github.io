<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F3EA">
  <title>Page not found | Taigo Sakai</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F7F3EA;
      --surface: #FFFFFF;
      --text: #111827;
      --muted: #5B6472;
      --primary: #071A2F;
      --accent: #8A611E;
      --stroke: rgba(17, 24, 39, 0.14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09131F;
        --surface: #102235;
        --text: #F4F0E7;
        --muted: #BFC5CC;
        --primary: #F4F0E7;
        --accent: #C6A15B;
        --stroke: rgba(226, 213, 184, 0.18);
      }
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 18px;
      background: var(--surface);
    }
    .code {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    h1 {
      margin: 0;
      color: var(--primary);
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.1;
    }
    p {
      margin: 18px 0 28px;
      color: var(--muted);
      line-height: 1.7;
    }
    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--bg);
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>このページは見つからない。URLが古いか、移動した可能性がある。</p>
    <a href="/">ポートフォリオへ戻る</a>
  </main>
</body>
</html>
